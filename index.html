<title>Anna's Voice Diary</title>
<style>
/* Layout: one phone column; a blurred magenta→indigo→yellow light-stripe band crowns each screen, pages below read like paper; tab bar pinned to the bottom. */
:root{
  --magenta:#e93fd9; --indigo:#4249d6; --sun:#f2c94a;
  --bg:#fbfaff; --paper:#ffffff; --ink:#1d1b3a; --muted:#6c6a8e; --line:#e7e5f5; --soft:#f2f0fc;
  --band-fade:#fbfaff;
  --display:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --ui:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --b-learn:#4249d6; --b-exp:#8a3fe0; --b-tom:#e93fd9; --b-hobby:#b98100; --b-future:#2f8fe0; --b-berlin:#d8557a; --b-teal:#138f80; --b-orange:#d9601f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13122a; --paper:#1c1b38; --ink:#f1efff; --muted:#a6a3c9; --line:#2e2c55; --soft:#24234a; --band-fade:#13122a;
  --b-learn:#8a90ff; --b-exp:#b98aff; --b-tom:#f27be6; --b-hobby:#f2c94a; --b-future:#6fb8ff; --b-berlin:#ff8fb0; --b-teal:#4fd8c4; --b-orange:#ff9a5c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13122a; --paper:#1c1b38; --ink:#f1efff; --muted:#a6a3c9; --line:#2e2c55; --soft:#24234a; --band-fade:#13122a;
  --b-learn:#8a90ff; --b-exp:#b98aff; --b-tom:#f27be6; --b-hobby:#f2c94a; --b-future:#6fb8ff; --b-berlin:#ff8fb0; --b-teal:#4fd8c4; --b-orange:#ff9a5c;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

.band{position:relative;height:150px;overflow:hidden;
  background:linear-gradient(90deg,var(--magenta) 0%,var(--magenta) 14%,var(--indigo) 42%,var(--indigo) 60%,var(--sun) 82%,var(--sun) 100%)}
.band::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 40px,rgba(255,255,255,.28) 46px,rgba(255,255,255,0) 54px 82px);
  filter:blur(3px)}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 15%,var(--band-fade) 96%)}
.band.small{height:96px}

.wrap{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:0 120px;margin-top:-64px;position:relative}
.band.small + .wrap{margin-top:-44px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:.2em 0 .1em;text-wrap:balance;letter-spacing:-.03em}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0;text-wrap:balance}
.lede{font-family:var(--body);font-size:16px;color:var(--muted);margin:.3em 0 1.2em}

.banner{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--ink)}

/* Speak */
.recorder{display:grid;gap:14px}
.mic{justify-self:center;width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;color:#fff;
  background:conic-gradient(from 200deg,var(--magenta),var(--indigo),var(--sun),var(--magenta));
  box-shadow:0 10px 30px -10px rgba(66,73,214,.6);display:grid;place-items:center;position:relative}
.mic svg{width:40px;height:40px}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--magenta);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.mic.on::after{animation:none}}
.mic-label{text-align:center;color:var(--muted);font-size:13px;min-height:1.2em}
textarea#draft{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--paper);
  padding:14px 16px;font-family:var(--body);font-size:17px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted)}

/* Day pages */
.day{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px;margin-bottom:16px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:6px}
.day-date{font-family:var(--display);font-weight:800;font-size:22px}
.day-date small{display:block;font-weight:400;font-size:13px;color:var(--muted);font-family:var(--ui)}
.session-time{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 4px}
.item{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:8px 0}
.item .bar{border-radius:4px;background:var(--c)}
.item p{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;min-width:0}
.item .meta{margin-top:4px}
select.bucket{border:0;background:transparent;color:var(--c);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:0;cursor:pointer}
.tag-ex{font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--muted);border-radius:999px;padding:3px 8px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 4px var(--magenta)}to{box-shadow:0 0 0 0 transparent}}

/* Chapters */
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:22px}
.toc button{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.toc button .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--c);font-variant-numeric:tabular-nums}
.toc button .l{font-size:13px;color:var(--muted)}
.chapter{margin-bottom:28px}
.chapter-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.point{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.point p{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;min-width:0}
.datelink{border:0;background:var(--soft);color:var(--c);border-radius:8px;padding:5px 6px;font-size:12px;font-weight:600;cursor:pointer;
  align-self:start;font-variant-numeric:tabular-nums;text-decoration:underline;text-underline-offset:2px}
.empty{color:var(--muted);font-family:var(--body);font-style:italic;padding:8px 0}

/* Chapter editor */
.chap-tools{display:flex;justify-content:flex-end;margin:-8px 0 14px}
.editor{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:6px 16px 16px;margin-bottom:22px}
.ed-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.ed-fields{display:grid;gap:6px;min-width:0}
.ed-fields input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px 10px;font:inherit}
.ed-fields input.nm{font-weight:600}
.ed-fields input.hn{font-size:13px;color:var(--muted)}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;margin-top:4px}
.ed-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:8px 4px;text-decoration:underline}
.ed-move{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px}
.ed-move select{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:4px 6px}
.ed-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:14px}
.btn.sm{padding:8px 14px;font-size:13px}

/* Reminders */
.reminders{display:grid;gap:8px;margin:10px 0 6px}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--soft);border-radius:12px;padding:10px 12px}
.rem svg{width:18px;height:18px;color:var(--magenta);margin-top:2px}
.rem .t{font-weight:600;font-size:15px}
.rem .w{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rem .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:13px;font-weight:600}
.rem .acts a,.rem .acts button{color:var(--indigo);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.up-head{margin:26px 0 4px}

/* Settings */
.settings{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:10px}
.settings label.btn{display:inline-block}
.set-row{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.set-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:8px 10px}


.nudge{width:100%;border:0;text-align:left;cursor:pointer;background:linear-gradient(90deg,color-mix(in srgb,var(--magenta) 18%,var(--paper)),color-mix(in srgb,var(--sun) 22%,var(--paper)));color:var(--ink);display:block}

/* Week */
.review{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.review section{padding:12px 0;border-top:1px solid var(--line)}
.review section:first-of-type{border-top:0}
.review p{font-family:var(--body);font-size:16px;line-height:1.5;margin:.3em 0}
.challenges{display:grid;gap:8px;margin-top:8px}
.ch{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--soft);border-radius:12px;padding:10px 12px}
.ch .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--c);padding-top:3px;white-space:nowrap}
.ch span:last-child{font-family:var(--body);font-size:16px;line-height:1.4}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px;z-index:5}
nav.tabs button{flex:1;max-width:130px;border:0;background:transparent;padding:8px 4px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--soft)}
.del-btn{margin-left:8px;border:0;background:none;padding:0;font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted, #888);text-decoration:underline;cursor:pointer}
.del-ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 10px;font-size:14px}
</style>

<div id="app"></div>
<nav class="tabs" aria-label="Diary sections">
  <button data-tab="speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Speak</button>
  <button data-tab="days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Days</button>
  <button data-tab="chapters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 8h6M9 12h6"/></svg>Chapters</button>
  <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6 .6-4.5 4 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.5-4 6-.6z"/></svg>Week</button>
</nav>

<script>
const COLOURS = ["--b-learn","--b-exp","--b-tom","--b-hobby","--b-future","--b-berlin","--b-teal","--b-orange"];
const DEFAULT_BUCKETS = [
  {k:"learn",  name:"Work learnings",        c:"--b-learn",  hint:"lessons and insights from work"},
  {k:"exp",    name:"Work experiences",      c:"--b-exp",    hint:"things that happened at work"},
  {k:"tom",    name:"Private life with Tom", c:"--b-tom",    hint:"my life with my partner Tom"},
  {k:"hobby",  name:"Hobbies",               c:"--b-hobby",  hint:"sport, making things, free time"},
  {k:"future", name:"Future",                c:"--b-future", hint:"goals, plans and wishes"},
  {k:"berlin", name:"Berlin",                c:"--b-berlin", hint:"the city, places and life there"},
];
let BUCKETS = DEFAULT_BUCKETS, B = {};
function setBuckets(list){
  BUCKETS = (Array.isArray(list) && list.length ? list : DEFAULT_BUCKETS)
    .filter(b=>b && b.k && b.name).map(b=>({k:String(b.k),name:String(b.name),c:COLOURS.includes(b.c)?b.c:COLOURS[0],hint:String(b.hint||"")}));
  B = Object.fromEntries(BUCKETS.map(b=>[b.k,b]));
}
try{ setBuckets(JSON.parse(localStorage.getItem("diary.chapters")||"null")); }catch{ setBuckets(null); }
// a point whose chapter was removed falls back to the first chapter
const eff = it=>B[it.b] ? it.b : BUCKETS[0].k;

// Example pages shown only until the first real entry is saved.
const EXAMPLES = [
  {id:"ex1",example:true,date:"2026-10-07",time:"21:10",text:"",items:[
    {t:"In the roadmap meeting I learned that showing one clear number up front made the whole discussion faster.",b:"learn"},
    {t:"Presented to the leadership team for the first time. I was nervous for the first two minutes and then it felt good.",b:"exp"},
    {t:"Tom cooked the lentil curry and we ate on the balcony until it got too cold.",b:"tom"}]},
  {id:"ex2",example:true,date:"2026-10-08",time:"22:02",text:"",items:[
    {t:"Bouldering at Berta Block, finally finished the blue route on the overhang.",b:"hobby"},
    {t:"I want to lead a project end to end by next summer.",b:"future"},
    {t:"Walked along the Landwehrkanal after work, the trees are turning orange already.",b:"berlin"}]},
];

// HOSTED: running as its own home-screen app (not inside Claude)
const HOSTED = !window.claude && /^https?:$/.test(location.protocol);
const S = { syncState:"", downloads:null, editing:null, moves:{}, removing:null, tab:"days", entries:[], live:false, reviews:{}, focusDay:null, db:null, uid:null, sample:null, saving:false };
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d=>d.toLocaleDateString("sv-SE");
const pretty = ds=>new Date(ds+"T12:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const short = ds=>new Date(ds+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const store = { get(){try{return JSON.parse(localStorage.getItem("diary.entries")||"[]")}catch{return[]}},
                set(v){try{localStorage.setItem("diary.entries",JSON.stringify(v))}catch{}} };

// a point that is only a chapter name (e.g. a pasted heading) is not a diary point
const isHeading = t=>BUCKETS.some(b=>b.name.toLowerCase()===String(t).replace(/[*#:_]/g,"").trim().toLowerCase());
// Deleted entries stay as a marker so the deletion syncs to the server and other phones.
const alive = ()=>S.entries.filter(e=>!e.deleted);
function visible(){ return (alive().length ? alive() : EXAMPLES).map(e=>({...e,items:e.items.map((it,i)=>({...it,_i:i})).filter(it=>!isHeading(it.t))})); }
function byDay(){
  const m = {};
  for (const e of visible()) (m[e.date] ||= []).push(e);
  for (const d in m) m[d].sort((a,b)=>a.time.localeCompare(b.time));
  return Object.keys(m).sort().reverse().map(d=>({date:d,sessions:m[d]}));
}

/* ---------- views ---------- */
function band(small){ return `<div class="band${small?" small":""}" aria-hidden="true"></div>`; }
function exampleBanner(){
  if (alive().length) return "";
  if (HOSTED && !getSyncPass()) return `<div class="banner" style="flex-wrap:wrap"><span>Already have a diary? Enter your diary password to load it from your server.</span>
    <div class="row" style="width:100%"><input id="connectPass" type="password" autocomplete="current-password" placeholder="Diary password"><button class="btn sm" id="connectSave">Load my diary</button></div>
    <span class="status" style="font-weight:400" id="connectState">${esc(S.syncState)}</span></div>`;
  return `<div class="banner"><span class="tag-ex">Example</span><span>These pages show how your diary will look. They disappear when you save your first entry.</span></div>`;
}
document.addEventListener("click", ev=>{
  if (ev.target.id!=="connectSave") return;
  const v=($("#connectPass")||{}).value||""; if (!v) return;
  try{localStorage.setItem("diary.syncpass",v)}catch{}
  setSyncState("Connecting…"); syncNow();
});
function itemHTML(it, e, idx){
  const k = eff(it), b = B[k];
  const opts = BUCKETS.map(x=>`<option value="${x.k}"${x.k===k?" selected":""}>${esc(x.name)}</option>`).join("");
  return `<div class="item" style="--c:var(${b.c})"><span class="bar"></span><div style="min-width:0"><p>${esc(it.t)}</p>
    <div class="meta"><select class="bucket" aria-label="Chapter" data-e="${e.id}" data-i="${idx}" ${e.example?"disabled":""}>${opts}</select></div></div></div>`;
}

const views = {
  speak(){
    const today = pretty(iso(new Date()));
    return band() + `<main class="wrap">
      ${views._nudge()}
      <div class="eyebrow">${esc(today)}</div>
      <h1>Tell me about today</h1>
      <p class="lede">Talk freely. I'll write it down and sort each part into its chapter.</p>
      ${HOSTED && !getKey() ? `<div class="banner"><span>For the best result, tap <b>Send to Claude</b>: Claude tidies your words and sorts them, and the entry lands here. <b>Save</b> keeps them as heard, and you can ask Claude to "tidy my diary" later.</span></div>` : ""}
      <div class="recorder">
        <button class="mic" id="mic" aria-label="Start speaking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <div class="mic-label" id="micLabel">Tap to speak</div>
        <div class="row" style="justify-content:center;gap:6px" role="group" aria-label="Language I speak">${[["en-GB","English"],["de-DE","Deutsch"]].map(([c,n])=>`<button class="btn ${getLang()===c?"":"ghost "}sm" data-lang="${c}" aria-pressed="${getLang()===c}">${n}</button>`).join("")}</div>
        <textarea id="draft" placeholder="Your words appear here. You can also tap the microphone on your phone's keyboard and dictate straight into this box."></textarea>
        <div class="row"><button class="btn" id="save">Save & sort into chapters</button>${HOSTED && !getKey() ? `<button class="btn ghost" id="toClaude">Send to Claude</button>` : ""}<span class="status" id="saveStatus"></span></div>
      </div>
      ${upcomingHTML()}</main>`;
  },
  _nudge(){
    const d=new Date().getDay(), from=weekStart();
    if (!HOSTED || d!==0 || S.reviews[from] || !alive().some(e=>e.date>=from)) return "";
    return `<button class="banner nudge" data-goweek><b>Your weekly review is ready.</b> <span>Tap to see this week's summary and challenges.</span></button>`;
  },
  days(){
    const days = byDay();
    return band(true) + `<main class="wrap"><div class="eyebrow">Your diary</div><h1>Days</h1><p class="lede">Every page is the day you spoke it.</p>
      ${exampleBanner()}
      ${days.map(d=>`<article class="day" id="day-${d.date}">
        <div class="day-head"><div class="day-date">${esc(short(d.date))}<small>${esc(pretty(d.date))}</small></div>
        ${d.sessions[0].example?'<span class="tag-ex">Example</span>':""}</div>
        ${d.sessions.map(e=>`<div class="session-time">${e.source==="claude"?"Told to Claude":"Spoken"} at ${esc(e.time)}${e.example?"":` <button class="del-btn" data-del="${esc(e.id)}" aria-label="Delete this entry">Delete</button>`}</div>${S.confirmDel===e.id?`<div class="del-ask"><span>Delete this entry? This can't be undone.</span><button class="btn sm" data-del-yes="${esc(e.id)}">Delete</button><button class="btn ghost sm" data-del-no>Cancel</button></div>`:""}${e.items.map(it=>itemHTML(it,e,it._i)).join("")}${remindersHTML(e.reminders)}`).join("")}
      </article>`).join("")}</main>`;
  },
  chapters(){
    const all = visible().flatMap(e=>e.items.map(it=>({...it,b:eff(it),date:e.date,time:e.time})));
    return band(true) + `<main class="wrap"><div class="eyebrow">Your diary</div><h1>Chapters</h1><p class="lede">Tap a date to open the full day.</p>
      ${exampleBanner()}
      ${S.editing ? editorHTML(all) : `<div class="chap-tools"><button class="btn ghost sm" id="editChapters">Edit chapters</button></div>`}
      <div class="toc">${BUCKETS.map(b=>`<button data-jump="${b.k}" style="--c:var(${b.c})"><span class="n">${all.filter(x=>x.b===b.k).length}</span><span class="l">${esc(b.name)}</span></button>`).join("")}</div>
      ${BUCKETS.map(b=>{

const BELL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>`;
const remWhen = r=>`${pretty(r.date)}${r.time?` at ${r.time}`:""}`;
function gcalLink(r){
  const d=r.date.replace(/-/g,"");
  let dates;
  if (r.time){ const [h,m]=r.time.split(":").map(Number); const end=new Date(`${r.date}T${r.time}`); end.setMinutes(end.getMinutes()+30);
    const f=x=>String(x).padStart(2,"0");
    dates=`${d}T${f(h)}${f(m)}00/${iso(end).replace(/-/g,"")}T${f(end.getHours())}${f(end.getMinutes())}00`; }
  else { const n=new Date(r.date+"T12:00"); n.setDate(n.getDate()+1); dates=`${d}/${iso(n).replace(/-/g,"")}`; }
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Berlin";
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(r.title)}&dates=${dates}&ctz=${encodeURIComponent(tz)}&details=${encodeURIComponent("From my voice diary")}`;
}
function remindersHTML(list){
  if (!list || !list.length) return "";
  return `<div class="reminders">${list.map(r=>`<div class="rem">${BELL}<div style="min-width:0"><div class="t">${esc(r.title)}</div><div class="w">${esc(remWhen(r))}</div>
    <div class="acts">${HOSTED
      ? `<button data-ics="${esc(JSON.stringify({title:r.title,date:r.date,time:r.time||""}))}">Add to Calendar</button>`
      : `<a href="${esc(gcalLink(r))}" target="_blank" rel="noopener">Add to Google Calendar</a>`}<button data-copy="${esc(r.title+" · "+remWhen(r))}">Copy</button></div></div></div>`).join("")}</div>`;
}
function upcomingHTML(){
  const today=iso(new Date());
  const ups = alive().flatMap(e=>e.reminders||[]).filter(r=>r.date>=today).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  return `<h2 class="up-head">Reminders</h2>${ups.length?remindersHTML(ups):`<div class="empty">Say "remind me of…" and it will show up here, ready to add to your calendar.</div>`}`;
}
function parseWhen(s){
  // light fallback for "tomorrow", weekday names and "at 3pm"; defaults to tomorrow 09:00
  const d=new Date(); let date=null; const low=s.toLowerCase();
  if (/\btoday\b|\btonight\b/.test(low)) date=new Date(d);
  else if (/\btomorrow\b/.test(low)){ date=new Date(d); date.setDate(d.getDate()+1); }
  else { const days=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"]; const i=days.findIndex(x=>low.includes(x));
    if (i>=0){ date=new Date(d); date.setDate(d.getDate()+(((i-d.getDay())+7)%7||7)); } }
  if (!date){ date=new Date(d); date.setDate(d.getDate()+1); }
  let time="09:00"; const m=low.match(/\bat (\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if (m){ let h=+m[1]; if (m[3]==="pm"&&h<12) h+=12; if (m[3]==="am"&&h===12) h=0; time=String(h).padStart(2,"0")+":"+(m[2]||"00"); }
  return {date:iso(date), time};
}

let rec=null;
// The phone's own language (often German) garbles English speech, so the language is chosen here.
const getLang = ()=>{ try{return localStorage.getItem("diary.lang")||"en-GB"}catch{return "en-GB"} };
function wireSpeak(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ if (rec) rec.stop(); try{localStorage.setItem("diary.lang",b.dataset.lang)}catch{} render(true); });
  const mic=$("#mic"), label=$("#micLabel"), draft=$("#draft");
  try{ draft.value = localStorage.getItem("diary.draft")||""; }catch{}
  draft.oninput = ()=>{ try{localStorage.setItem("diary.draft",draft.value)}catch{} };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  mic.onclick = ()=>{
    if (!SR){ label.textContent="Tap the box below, then the microphone on your keyboard to dictate."; draft.focus(); return; }
    if (rec){ rec.stop(); return; }
    rec = new SR(); rec.continuous=true; rec.interimResults=true; rec.lang = getLang();
    const base = draft.value ? draft.value.trimEnd()+"\n" : "";
    let finalText="";
    rec.onresult = ev=>{ let interim="";
      for (let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i];
        if (r.isFinal) finalText += r[0].transcript.trim()+" "; else interim += r[0].transcript; }
      draft.value = base + finalText + interim; draft.oninput(); };
    rec.onstart = ()=>{ mic.classList.add("on"); label.textContent="Listening… tap again to stop"; };
    rec.onerror = ev=>{ label.textContent = ev.error==="not-allowed"||ev.error==="service-not-allowed"
      ? "The microphone isn't available here. Tap the box, then the microphone on your keyboard to dictate."
      : "I stopped listening ("+ev.error+"). Tap to try again."; };
    rec.onend = ()=>{ mic.classList.remove("on"); rec=null; if (!/microphone|stopped/.test(label.textContent)) label.textContent="Tap to speak"; };
    try{ rec.start(); }catch{ label.textContent="Tap the box, then the microphone on your keyboard to dictate."; rec=null; }
  };
  $("#save").onclick = saveEntry;
  // Claude sorts and saves it through the diary connector, so it comes back here tidied.
  const tc=$("#toClaude"); if (tc) tc.onclick = async ()=>{
    const words=draft.value.trim(); if (!words){ $("#saveStatus").textContent="Say or type something first."; return; }
    const msg="Diary: "+words;

    draft.value=""; draft.oninput();
    $("#saveStatus").textContent="Opening Claude. If the text isn't filled in, paste it.";
    location.href="https://claude.ai/new?q="+encodeURIComponent(msg);
  };
}

/* ---------- sorting with Claude (keyword fallback) ---------- */
const KEYWORDS = {
  tom:/\btom\b|\bwe\b.*(dinner|weekend|holiday)|date night|together/i,
  berlin:/berlin|kreuzberg|neuk[öo]lln|mitte|prenzlauer|friedrichshain|spree|tempelhof|u-?bahn|s-?bahn|kiez|landwehr/i,
  future:/\bi want to\b|\bone day\b|next year|in the future|\bgoal|\bplan to\b|\bdream/i,
  hobby:/climb|boulder|run|yoga|paint|read|book|guitar|piano|cook|bake|swim|hike|knit|photo/i,
  learn:/learn|realis|realiz|insight|lesson|next time|takeaway|understood/i,
  exp:/meeting|work|colleague|boss|client|project|present|office|team/i,
};
const REMIND = /\bremind me\s+(?:of|to|about|that)?\s*(.+)/i;
function fallbackSort(text){
  const reminders=[], rest=[];
  text.split(/\n+|(?<=[.!?])\s+(?=[A-Z])/).forEach(line=>{ const m=line.match(REMIND);
    if (m){ const w=parseWhen(m[1]); const cap=x=>x.charAt(0).toUpperCase()+x.slice(1); reminders.push({title:cap(m[1].replace(/[.!?]+$/,"").replace(/\b(today|tonight|tomorrow|on \w+day|at \d{1,2}(:\d{2})?\s*(am|pm)?)\b/gi,"").replace(/\s+/g," ").trim()||m[1]),...w}); }
    else rest.push(line); });
  return {reminders, items: sortLines(rest.join("\n"))};
}
function sortLines(text){
  return text.split(/\n+|(?<=[.!?])\s+(?=[A-Z])/).map(s=>s.replace(/^[-•*]\s*/,"").trim()).filter(t=>t && !isHeading(t))
    .map(t=>({t, b:(Object.keys(KEYWORDS).find(k=>B[k] && KEYWORDS[k].test(t)) || BUCKETS.find(b=>t.toLowerCase().includes(b.name.toLowerCase()))?.k || BUCKETS[0].k)}));
}
async function sortWithClaude(text){
  if (!S.sample) return fallbackSort(text);
  const now = new Date();
  const prompt = `You organise a personal voice diary. Today is ${now.toLocaleDateString("en-GB",{weekday:"long"})} ${iso(now)}, and the time is ${now.toTimeString().slice(0,5)}. Split the transcript below into separate points: one per story, paragraph, or bullet. Keep the writer's own words and first person; only fix obvious transcription slips and add punctuation. Assign each point to exactly one chapter, using the chapter's key:
${BUCKETS.map(b=>`${b.k} = ${b.name}${b.hint?` (${b.hint})`:""}`).join("\n")}
Skip any line that is only a heading or a chapter name (such as "Work learnings"); it is not a point.
Separately, find every reminder request (such as "remind me of…", "remind me to…", "don't let me forget…"). Turn each into a short calendar title in the writer's words, with a date (YYYY-MM-DD) and a time (HH:MM, 24h). Resolve relative dates from today. If no time is given use "09:00"; if no day is given use tomorrow. Leave reminder sentences out of the points.
Reply with only JSON like {"points":[{"t":"...","b":"${BUCKETS[0].k}"}],"reminders":[{"title":"Call mum","date":"2026-10-10","time":"09:00"}]}.

Transcript:
${text}`;
  const out = await S.sample.json(prompt, {modelTier:"default"});
  const pts = Array.isArray(out) ? out : out && out.points;
  if (!Array.isArray(pts)) throw {code:"invalid_json"};
  const reminders = (Array.isArray(out.reminders)?out.reminders:[]).filter(r=>r && r.title && /^\d{4}-\d{2}-\d{2}$/.test(r.date))
    .map(r=>({title:String(r.title).trim(), date:r.date, time:/^\d{2}:\d{2}$/.test(r.time||"")?r.time:""}));
  return {reminders, items: pts.filter(x=>x && typeof x.t==="string" && x.t.trim() && !isHeading(x.t)).map(x=>({t:x.t.trim(), b:B[x.b]?x.b:BUCKETS[0].k}))};
}

async function saveEntry(){
  const draft=$("#draft"), st=$("#saveStatus"), btn=$("#save");
  const text = draft.value.trim(); if (!text){ st.textContent="Say or type something first."; return; }
  btn.disabled=true; st.textContent = S.sample ? "Sorting into chapters…" : "Saving…";
  let items, reminders;
  try{ ({items, reminders} = await sortWithClaude(text)); }
  catch(e){ ({items, reminders} = fallbackSort(text));
    st.textContent = e.code==="not_granted" ? "Sorted with simple rules, since Claude wasn't allowed. You can change any chapter on the Days page."
      : e.code==="no_key" ? "Saved with simple sorting. For smart sorting, tell Claude \"diary: …\" instead."
      : e.code==="bad_key" ? "Sorted with simple rules, because Claude didn't accept your API key. Check it on the Week page."
      : "Sorted with simple rules. You can change any chapter on the Days page."; }
  const now = new Date();
  const entry = {id:"e"+now.getTime(), date:iso(now), time:now.toTimeString().slice(0,5), createdAt:now.getTime(), text, items, reminders};
  S.entries.push(entry); await persist(entry);
  draft.value=""; try{localStorage.removeItem("diary.draft")}catch{}
  btn.disabled=false; S.focusDay=entry.date; go("days");
}

/* ---------- weekly review ---------- */
function weekStart(){ const d=new Date(); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }
function weekItems(from){ return visible().filter(e=>e.date>=from || e.example).flatMap(e=>e.items.map(it=>({...it,b:eff(it),date:e.date}))); }
async function writeReview(){
  const from=weekStart(), items=weekItems(from), st=$("#reviewStatus"), btn=$("#review");
  if (!S.sample){ st.textContent="The weekly review needs Claude, which isn't available in this view."; return; }
  btn.disabled=true; st.textContent="Reading your week…";
  const list = BUCKETS.map(b=>{const xs=items.filter(i=>i.b===b.k); return xs.length?`## ${b.k} (${b.name})\n`+xs.map(i=>`- [${i.date}] ${i.t}`).join("\n"):""}).filter(Boolean).join("\n\n");
  const prompt = `You are a warm, direct self-development coach reading someone's diary for the past week. For each chapter below that has points, write a 1-3 sentence summary in second person ("you"), then 1-3 challenges. Each challenge has a type: "future" (think about the future here), "again" (do this again), or "train" (practise or train this skill). Make challenges concrete and small enough to do next week, grounded in what she actually wrote.
Reply with only JSON: {"buckets":[{"bucket":"${BUCKETS[0].k}","summary":"...","challenges":[{"type":"train","text":"..."}]}]}

${list}`;
  try{
    const rv = await S.sample.json(prompt,{modelTier:"default"});
    rv.at=Date.now(); S.reviews[from]=rv; await persistReview(from,rv); render();
  }catch(e){ btn.disabled=false; st.textContent = e.code==="not_granted" ? "Claude wasn't allowed, so there's no review this time." : e.code==="no_key" ? "Add your Claude API key below first." : e.code==="bad_key" ? "Claude didn't accept your API key. Check it below." : e.code==="rate_limited" ? "Too many requests just now. Try again in a minute." : "The review didn't come through. Try again."; }
}

    const data = JSON.stringify({app:"voice-diary",version:1,exportedAt:new Date().toISOString(),entries:alive(),chapters:BUCKETS,reviews:S.reviews},null,2);
    const filename = `voice-diary-${iso(new Date())}.json`;
    if (S.downloads){ try{ await S.downloads.save({filename,data}); st.textContent="Backup saved."; }catch(e){ st.textContent = e.code==="declined"?"Export cancelled.":"Export isn't available here."; } return; }
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=filename; a.click(); st.textContent="Backup saved."; }
    catch{ st.textContent="Export isn't available here."; }
  };
  $("#importFile").onchange = async e=>{
    const f=e.target.files[0]; if (!f) return;
    try{
      const d=JSON.parse(await f.text()); if (d.app!=="voice-diary" || !Array.isArray(d.entries)) throw 0;
      if (Array.isArray(d.chapters) && d.chapters.length){ setBuckets(d.chapters); try{localStorage.setItem("diary.chapters",JSON.stringify(BUCKETS))}catch{} markChapters();
        if (S.db && S.uid){ try{ await S.db.collection("data/users/"+S.uid).doc("chapters").set({kind:"chapters",list:BUCKETS}); }catch{} } }
      let n=0; for (const en of d.entries){ if (!en || !en.id || S.entries.some(x=>x.id===en.id)) continue; S.entries.push(en); n++; await persist(en); }
      S.entries.sort((a,b)=>a.createdAt-b.createdAt);
      for (const w in (d.reviews||{})) if (!S.reviews[w]){ S.reviews[w]=d.reviews[w]; await persistReview(w,d.reviews[w]); }
      render(true); $("#setStatus").textContent=`Imported ${n} entr${n===1?"y":"ies"}.`;
    }catch{ st.textContent="That file isn't a diary backup."; }
  };
  if (!HOSTED) return;
  $("#keySave").onclick=()=>{ try{localStorage.setItem("diary.apikey",$("#apikey").value.trim())}catch{} st.textContent="Key saved."; };
  $("#syncSave").onclick=()=>{ try{localStorage.setItem("diary.syncpass",$("#syncpass").value)}catch{} setSyncState("Connecting…"); syncNow(); };
}

/* Claude for the home-screen app: called straight from the phone with Anna's own key */
function parseLoose(t){
  try{ return JSON.parse(t); }catch{}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try{ return JSON.parse(f[1]); }catch{} }
  const i=t.search(/[\[{]/), j=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if (i>=0 && j>i){ try{ return JSON.parse(t.slice(i,j+1)); }catch{} }
  throw {code:"invalid_json"};
}
const hostedSample = { async json(prompt){
  const key = getKey(); if (!key) throw {code:"no_key"};
  let r;
  try{
    r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "content-type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01",
      "anthropic-beta":"server-side-fallback-2026-07-01", "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-opus-5-5", max_tokens:16000, output_config:{effort:"medium"}, fallbacks:"default",
        messages:[{role:"user",content:prompt}]})});
  }catch{ throw {code:"offline"}; }
  if (r.status===401 || r.status===403) throw {code:"bad_key"};
  if (r.status===429) throw {code:"rate_limited"};
  if (!r.ok) throw {code:"unavailable"};
  const msg = await r.json();
  if (msg.stop_reason==="refusal") throw {code:"declined"};
  return parseLoose((msg.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""));
}};

/* calendar: an .ics opened on an iPhone shows the "Add to Calendar" screen */
function icsFor(r){
  const e=x=>String(x).replace(/[\;,]/g,c=>"\\"+c).replace(/\r?\n/g,"\\n");
  const d=r.date.replace(/-/g,"");
  let when;
  if (r.time){ const t=r.time.replace(":",""); const end=new Date(`${r.date}T${r.time}`); end.setMinutes(end.getMinutes()+30);
    const f=x=>String(x).padStart(2,"0");
    when=[`DTSTART:${d}T${t}00`,`DTEND:${iso(end).replace(/-/g,"")}T${f(end.getHours())}${f(end.getMinutes())}00`]; }
  else { const n=new Date(r.date+"T12:00"); n.setDate(n.getDate()+1); when=[`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${iso(n).replace(/-/g,"")}`]; }
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Voice Diary//EN","METHOD:PUBLISH","BEGIN:VEVENT",
    `UID:${d}-${Date.now()}@voice-diary`,`DTSTAMP:${stamp}`,...when,`SUMMARY:${e(r.title)}`,"DESCRIPTION:From my voice diary",
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${e(r.title)}`,"TRIGGER:-PT0M","END:VALARM","END:VEVENT","END:VCALENDAR",""].join("\r\n");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ics]"); if (!b) return;
  const r=JSON.parse(b.dataset.ics);
  location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(icsFor(r));
});

/* ---------- storage: private per-person db, else this browser ---------- */
async function persist(entry){
  entry.updatedAt = Date.now();
  if (S.db && S.uid){ try{ await S.db.collection("data/users/"+S.uid).doc(entry.id).set({kind:"entry",...entry}); return; }catch{} }
  store.set(S.entries); queueSync();
}
async function persistReview(from,rv){
  if (S.db && S.uid){ try{ await S.db.collection("data/users/"+S.uid).doc("review-"+from).set({kind:"review",week:from,review:rv}); return; }catch{} }
  try{ localStorage.setItem("diary.reviews",JSON.stringify(S.reviews)); }catch{}
  queueSync();
}

/* ---------- home-screen app: keep a copy on Anna's own server ---------- */
const getSyncPass = ()=>{ try{return localStorage.getItem("diary.syncpass")||""}catch{return ""} };
const chaptersAt = ()=>{ try{return +localStorage.getItem("diary.chaptersAt")||0}catch{return 0} };
function markChapters(){ try{ localStorage.setItem("diary.chaptersAt",String(Date.now())); }catch{} queueSync(); }
let syncTimer=null;
function queueSync(){ if (!HOSTED || !getSyncPass()) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,1000); }
function setSyncState(text){ S.syncState=text; for (const id of ["#syncState","#connectState"]){ const el=$(id); if (el) el.textContent=text; } }
async function syncNow(){
  const pw=getSyncPass(); if (!HOSTED || !pw) return;
  const auth={authorization:"Bearer "+pw};
  let r;
  try{ r=await fetch("api/diary",{headers:auth,cache:"no-store"}); }catch{ setSyncState("Offline. Your changes are saved on this phone and will sync later."); return; }
  if (r.status===401){ setSyncState("The server didn't accept that password."); if (!alive().length){ try{localStorage.removeItem("diary.syncpass")}catch{} render(true); } return; }
  if (r.status===429){ setSyncState("Too many wrong passwords. Try again in 15 minutes."); return; }
  if (!r.ok){ setSyncState("Saving to your server isn't set up yet."); return; }
  const srv = await r.json();
  // merge: newest version of each entry wins, nothing gets dropped
  const byId = new Map(S.entries.map(e=>[e.id,e]));
  let pulled = 0;
  for (const e of (srv.entries||[])){
    const mine = byId.get(e.id);
    if (!mine || (e.updatedAt||e.createdAt||0) > (mine.updatedAt||mine.createdAt||0)){ byId.set(e.id,e); pulled++; }
  }
  S.entries = [...byId.values()].sort((a,b)=>a.createdAt-b.createdAt);
  store.set(S.entries);
  for (const w in (srv.reviews||{})) if (!S.reviews[w] || (srv.reviews[w]?.at||0) > (S.reviews[w]?.at||0)){ S.reviews[w]=srv.reviews[w]; pulled++; }
  try{ localStorage.setItem("diary.reviews",JSON.stringify(S.reviews)); }catch{}
  if (Array.isArray(srv.chapters) && srv.chapters.length && (srv.chaptersAt||0) > chaptersAt()){
    setBuckets(srv.chapters); pulled++;
    try{ localStorage.setItem("diary.chapters",JSON.stringify(BUCKETS)); localStorage.setItem("diary.chaptersAt",String(srv.chaptersAt)); }catch{}
  }
  try{
    const w = await fetch("api/diary",{method:"PUT",headers:{...auth,"content-type":"application/json"},
      body:JSON.stringify({entries:S.entries,chapters:BUCKETS,chaptersAt:chaptersAt(),reviews:S.reviews})});
    if (!w.ok) throw 0;
    setSyncState("Saved on your server · "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  }catch{ setSyncState("Couldn't save to your server just now. It will try again."); }
  if (pulled && S.tab!=="speak" && !S.editing) render(true);
}

try{ const t=localStorage.getItem("diary.tab"); if (views[t]) S.tab=t; }catch{}
S.entries = store.get();
try{ S.reviews = JSON.parse(localStorage.getItem("diary.reviews")||"{}"); }catch{}
if (HOSTED){
  S.sample = hostedSample;
  try{ navigator.storage?.persist?.(); }catch{}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if (location.hash==="#week") S.tab="week";
}
render();
if (HOSTED){ syncNow(); addEventListener("online",syncNow); document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible") syncNow(); }); }

(async()=>{
  const c = window.claude; if (!c?.use) return;
  const [db,user,sample,downloads] = await Promise.all([c.use("db"),c.use("user"),c.use("sample"),c.use("downloads")]);
  S.sample = sample; S.downloads = downloads;
  if (db && user){
    try{
      S.uid = await user.id(); S.db = db;
      db.collection("data/users/"+S.uid).onSnapshot(snap=>{
        const es=[], rs={}; let chapters=null;
        snap.docs.forEach(d=>{const v=d.data()||{}; if (v.kind==="entry") es.push(v); else if (v.kind==="review") rs[v.week]=v.review; else if (v.kind==="chapters") chapters=v.list;});
        if (chapters){ setBuckets(chapters); try{localStorage.setItem("diary.chapters",JSON.stringify(chapters))}catch{} }
        // move anything saved only in this browser into the private store once
        const local = store.get().filter(l=>!es.some(e=>e.id===l.id));
        local.forEach(l=>{ es.push(l); persist(l); });
        if (local.length) store.set([]);
        S.entries = es.sort((a,b)=>a.createdAt-b.createdAt); S.reviews=rs;
        if (S.tab!=="speak" && !S.editing) render(true);
      });
    }catch{}
  }
})();
